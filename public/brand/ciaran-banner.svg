<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="bannerGlow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f9cb55" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0c0c0e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
