    <rect x="8" y="8" width="234" height="404" rx="28" fill="#121214" />
    <rect x="75" y="16" width="100" height="16" rx="8" fill="#09090b" />
    <rect x="24" y="52" width="202" height="110" rx="16" fill="#f9cb55" fill-opacity="0.2" stroke="#f9cb55" stroke-opacity="0.4" />
    <text x="125" y="112" font-family="'Impact', sans-serif" font-size="28" fill="#f9cb55" text-anchor="middle">CIARÁN</text>
    <rect x="24" y="178" width="202" height="50" rx="12" fill="#24242a" />
    <rect x="24" y="238" width="202" height="50" rx="12" fill="#24242a" />
    <rect x="24" y="298" width="202" height="50" rx="12" fill="#24242a" />
