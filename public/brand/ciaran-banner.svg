    <line x1="0" y1="0" x2="400" y2="630" />
    <line x1="100" y1="0" x2="500" y2="630" />
    <line x1="200" y1="0" x2="600" y2="630" />
  </g>

  <!-- Left Side: App Icon & Typography -->
