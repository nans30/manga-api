    </text>

    <!-- Subtitle Pill -->
    <rect x="174" y="110" width="300" height="32" rx="8" fill="#f9cb55" fill-opacity="0.2" />
    <text x="188" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#f9cb55">
