<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9cb55" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#121212" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161618" />
      <stop offset="100%" stop-color="#0e0e10" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#f9cb55" flood-opacity="0.15" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Stage -->
  <rect width="1000" height="800" rx="36" fill="#121212" />
  <circle cx="500" cy="400" r="420" fill="url(#stageGlow)" />

  <!-- Background Comic Dots Grid Pattern -->
  <g opacity="0.06" fill="#ffffff">
    <circle cx="100" cy="100" r="3" /><circle cx="150" cy="100" r="3" /><circle cx="200" cy="100" r="3" /><circle cx="250" cy="100" r="3" />
    <circle cx="100" cy="150" r="3" /><circle cx="150" cy="150" r="3" /><circle cx="200" cy="150" r="3" /><circle cx="250" cy="150" r="3" />
    <circle cx="100" cy="200" r="3" /><circle cx="150" cy="200" r="3" /><circle cx="200" cy="200" r="3" /><circle cx="250" cy="200" r="3" />
    <circle cx="750" cy="600" r="3" /><circle cx="800" cy="600" r="3" /><circle cx="850" cy="600" r="3" /><circle cx="900" cy="600" r="3" />
    <circle cx="750" cy="650" r="3" /><circle cx="800" cy="650" r="3" /><circle cx="850" cy="650" r="3" /><circle cx="900" cy="650" r="3" />
  </g>

  <!-- Floating Left Hero Pill: Fast DoH & Multi-Source -->
  <g transform="translate(60, 240)" filter="url(#cardShadow)">
    <rect width="210" height="74" rx="20" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1.5" />
    <circle cx="40" cy="37" r="18" fill="#f9cb55" fill-opacity="0.2" />
    <text x="40" y="42" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#f9cb55" text-anchor="middle">⚡</text>
    <text x="70" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#f8f8f8">2-WAY API SYNC</text>
    <text x="70" y="49" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#a1a1aa">MangaDex + Komiku</text>
  </g>

  <!-- Floating Left Badge: Reading Experience -->
  <g transform="translate(80, 420)" filter="url(#cardShadow)">
    <rect width="190" height="74" rx="20" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1.5" />
    <circle cx="38" cy="37" r="18" fill="#10b981" fill-opacity="0.2" />
    <text x="38" y="42" font-family="'Segoe UI', sans-serif" font-size="15" fill="#10b981" text-anchor="middle">📖</text>
    <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#f8f8f8">AUTO-SCROLL</text>
    <text x="68" y="49" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#a1a1aa">Zero-Lag Reader</text>
  </g>

  <!-- Central Smartphone Device Mockup -->
  <g transform="translate(320, 60)" filter="url(#phoneShadow)">
    <!-- Device Outer Chassis -->
    <rect width="360" height="680" rx="54" fill="url(#phoneBody)" stroke="#3f3f46" stroke-width="3" />
    <!-- Device Screen Bezel Inner Line -->
    <rect x="12" y="12" width="336" height="656" rx="44" fill="url(#screenGrad)" />

    <!-- Screen Dynamic Island / Camera Pill -->
    <rect x="135" y="24" width="90" height="22" rx="11" fill="#09090b" />
    <circle cx="205" cy="35" r="4" fill="#1e1e24" />

    <!-- Mobile Screen UI Mockup: Ciaran Header -->
    <g transform="translate(28, 64)">
      <!-- Mini Brand Logo -->
      <rect width="32" height="32" rx="9" fill="#f9cb55" />
      <g transform="translate(2, 2) scale(0.44)">
        <path
          d="M44.5 21.5L39.5 16.5H23.5L17.5 22.5V41.5L23.5 47.5H39.5L45 42L39.5 36.5L36.5 39.5H26.5L25 38V26L26.5 24.5H36.5L39.5 27.5L44.5 21.5Z"
          fill="#121212"
        />
      </g>
      <text x="40" y="22" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#f8f8f8" letter-spacing="1">Ciarán</text>

      <!-- Search Icon Button -->
      <circle cx="280" cy="16" r="14" fill="#242428" />
      <text x="280" y="21" font-size="12" fill="#f9cb55" text-anchor="middle">🔍</text>
    </g>

    <!-- Hero Comic Card on Screen -->
    <g transform="translate(28, 116)">
      <rect width="304" height="150" rx="20" fill="#27272a" />
      <rect width="304" height="150" rx="20" fill="url(#stageGlow)" />
      <!-- Starburst Badge -->
      <rect x="16" y="16" width="76" height="22" rx="7" fill="#f9cb55" />
      <text x="54" y="31" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#121212" text-anchor="middle">TRENDING</text>
      <!-- Title -->
      <text x="16" y="90" font-family="'Impact', sans-serif" font-size="24" fill="#ffffff" letter-spacing="1">SOLO LEVELING</text>
      <text x="16" y="110" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f9cb55">Ch. 200 • Bahasa Indonesia</text>
      <text x="16" y="128" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a1a1aa">Komiku + MangaDex Unified</text>
    </g>

    <!-- Mini Manga Grid Rows -->
    <g transform="translate(28, 286)">
      <text x="0" y="18" font-family="'Impact', sans-serif" font-size="14" fill="#f8f8f8" letter-spacing="1">UPDATE TERBARU</text>
      <text x="304" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f9cb55" text-anchor="end">Lihat Semua →</text>

      <!-- Comic Card 1 -->
      <g transform="translate(0, 30)">
        <rect width="94" height="135" rx="14" fill="#27272a" />
        <rect x="6" y="6" width="82" height="100" rx="10" fill="#3f3f46" />
        <text x="47" y="62" font-size="20" text-anchor="middle">🗡️</text>
        <text x="6" y="122" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#f8f8f8">Chainsaw Man</text>
        <rect x="52" y="10" width="32" height="14" rx="4" fill="#10b981" />
        <text x="68" y="20" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">Ch. 168</text>
      </g>

      <!-- Comic Card 2 -->
      <g transform="translate(105, 30)">
        <rect width="94" height="135" rx="14" fill="#27272a" />
        <rect x="6" y="6" width="82" height="100" rx="10" fill="#3f3f46" />
        <text x="47" y="62" font-size="20" text-anchor="middle">🏴‍☠️</text>
        <text x="6" y="122" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#f8f8f8">One Piece</text>
        <rect x="52" y="10" width="32" height="14" rx="4" fill="#f9cb55" />
        <text x="68" y="20" font-size="7" font-weight="900" fill="#121212" text-anchor="middle">Ch. 1130</text>
      </g>

      <!-- Comic Card 3 -->
      <g transform="translate(210, 30)">
        <rect width="94" height="135" rx="14" fill="#27272a" />
        <rect x="6" y="6" width="82" height="100" rx="10" fill="#3f3f46" />
        <text x="47" y="62" font-size="20" text-anchor="middle">🥋</text>
        <text x="6" y="122" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#f8f8f8">Jujutsu Kaisen</text>
        <rect x="52" y="10" width="32" height="14" rx="4" fill="#10b981" />
        <text x="68" y="20" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">Ch. 271</text>
      </g>
    </g>

    <!-- Bottom Nav Bar on Screen -->
    <g transform="translate(12, 595)">
      <rect width="336" height="60" fill="#16161a" fill-opacity="0.95" />
      <line x1="0" y1="0" x2="336" y2="0" stroke="#27272a" stroke-width="1" />
      <text x="56" y="34" font-size="14" text-anchor="middle">🏠</text>
      <text x="168" y="34" font-size="14" text-anchor="middle">📚</text>
      <text x="280" y="34" font-size="14" text-anchor="middle">🔖</text>
      <!-- Home Indicator bar -->
      <rect x="118" y="48" width="100" height="4" rx="2" fill="#ffffff" fill-opacity="0.4" />
    </g>
  </g>

  <!-- Floating Right Hero Card: PWA & Offline -->
  <g transform="translate(730, 260)" filter="url(#cardShadow)">
    <rect width="210" height="74" rx="20" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1.5" />
    <circle cx="40" cy="37" r="18" fill="#3b82f6" fill-opacity="0.2" />
    <text x="40" y="42" font-family="'Segoe UI', sans-serif" font-size="15" fill="#3b82f6" text-anchor="middle">📱</text>
    <text x="70" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#f8f8f8">INSTALL PWA</text>
    <text x="70" y="49" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#a1a1aa">iOS / Android / PC</text>
  </g>

  <!-- Floating Right Card: Anti-ISP Block -->
  <g transform="translate(710, 440)" filter="url(#cardShadow)">
    <rect width="230" height="74" rx="20" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1.5" />
    <circle cx="40" cy="37" r="18" fill="#f59e0b" fill-opacity="0.2" />
    <text x="40" y="42" font-family="'Segoe UI', sans-serif" font-size="15" fill="#f59e0b" text-anchor="middle">🛡️</text>
    <text x="70" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#f8f8f8">DNS OVER HTTPS</text>
    <text x="70" y="49" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#a1a1aa">Bypass Blokir ISP Bebas VPN</text>
  </g>
</svg>